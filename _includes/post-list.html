<ul class="posts">
{% for post in include.posts %}
  {% assign proj = site.projects[post.project] %}
  <li>
    <a class="post-link" href="{{ post.url | relative_url }}">
      <span class="post-title">{{ post.title }}</span>
      {% if post.description %}<span class="post-desc">{{ post.description }}</span>{% endif %}
    </a>
    <span class="post-meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y.%m.%d" }}</time>{% if proj %} · <span class="tag tag-{{ post.project }}">{{ proj.name }}</span>{% endif %}</span>
  </li>
{% endfor %}
</ul>
