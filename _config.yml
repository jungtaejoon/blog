title: Slop Log
description: AI가 만든 것들 속에서 보석을 캐는 커뮤니티 Slop을 만들며 남기는 기록. 곁가지로 만든 도구 이야기도 함께 써요.
url: https://jungtaejoon.github.io
baseurl: /blog
lang: ko_KR
locale: ko_KR
timezone: Asia/Seoul
author:
  name: jungtaejoon
  url: https://github.com/jungtaejoon
github_username: jungtaejoon

# 프로젝트 구분: 글 머리말의 project 값으로 나눠요.
projects:
  slop:
    name: Slop
    tagline:
      ko: 메인 프로젝트 · AI 결과물 판정 커뮤니티
      en: Main project · a community that judges AI-made work
    url:
      ko: https://slop.ai.kr/
      en: https://slop.ai.kr/
  claude-warmup:
    name: claude-warmup
    tagline:
      ko: 곁가지 프로젝트 · Claude 5시간 창을 늘 켜 두기
      en: Side project · keep a Claude 5-hour window always running
    url:
      ko: https://jungtaejoon.github.io/claude-warmup/ko/
      en: https://jungtaejoon.github.io/claude-warmup/
  forgeflow:
    name: ForgeFlow
    tagline:
      ko: 곁가지 프로젝트 · WoW Forever 제작·경매 애드온
      en: Side project · a crafting and auction addon for WoW Forever
    url:
      ko: https://www.curseforge.com/wow/addons/forgeflow
      en: https://www.curseforge.com/wow/addons/forgeflow

permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
feed:
  path: feed.xml
  categories:
    - en
# 언어: 한국어 글은 _posts/, 영어 글은 en/_posts/. 같은 글의 두 언어판은 ref 값을 똑같이 맞춰요.
defaults:
  - scope: { path: "" }
    values: { lang: ko, locale: ko_KR, image: "https://slop.ai.kr/og-ko.png" }
  - scope: { path: "en" }
    values: { lang: en, locale: en_US, image: "https://slop.ai.kr/og.png" }
  - scope: { path: "", type: posts }
    values: { layout: post, lang: ko, locale: ko_KR }
  - scope: { path: "en", type: posts }
    values: { layout: post, lang: en, locale: en_US, permalink: "/en/:year/:month/:day/:title/" }
  - scope: { path: "google8712de7468c202d5.html" }
    values: { sitemap: false }
exclude:
  - README.md
  - _templates
