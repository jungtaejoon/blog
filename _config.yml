title: Slop Log
description: AI가 만든 것들 속에서 보석을 캐는 커뮤니티 Slop을 만들며 남기는 기록. 곁가지로 만든 도구 이야기도 함께 써요.
url: https://jungtaejoon.github.io
baseurl: /blog
lang: ko_KR
locale: ko_KR
timezone: Asia/Seoul
author:
  name: jungtaejoon
  url: https://github.com/jungtaejoon
github_username: jungtaejoon

# 프로젝트 구분: 글 머리말의 project 값으로 나눠요.
projects:
  slop:
    name: Slop
    tagline:
      ko: 메인 프로젝트 · AI 결과물 판정 커뮤니티
      en: Main project · a community that judges AI-made work
    url:
      ko: https://jungtaejoon.github.io/slop/
      en: https://jungtaejoon.github.io/slop/
  claude-warmup:
    name: claude-warmup
    tagline:
      ko: 곁가지 프로젝트 · Claude 5시간 한도 리셋 시간 맞추기
      en: Side project · time your Claude 5-hour limit resets
    url:
      ko: https://jungtaejoon.github.io/claude-warmup/ko/
      en: https://jungtaejoon.github.io/claude-warmup/

permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
feed:
  path: feed.xml
# 언어: 한국어 글은 _posts/, 영어 글은 en/_posts/. 같은 글의 두 언어판은 ref 값을 똑같이 맞춰요.
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, lang: ko }
  - scope: { path: "en", type: posts }
    values: { layout: post, lang: en, permalink: "/en/:year/:month/:day/:title/" }
  - scope: { path: "" }
    values: { lang: ko }
  - scope: { path: "en" }
    values: { lang: en }
exclude:
  - README.md
  - _templates
